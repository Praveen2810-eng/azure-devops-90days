name: Day10 Build Test Artifact
 
on:
  push:
    branches:
      - main
      - feature/day10-devops
  pull_request:
    branches:
      - main
 
jobs:
  build-test:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
 
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
 
      - name: Run tests
        run: |
          pytest day10/test_app.py
 
      - name: Create build artifact
        run: |
          mkdir -p artifact
          zip -j artifact/day10-app.zip day10/app.py
 
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: day10-app-artifact
          path: artifact/day10-app.zip
