name: Day8 Python CI
 
on:
  push:
    branches:
      - main
      - feature/day8-devops
  pull_request:
    branches:
      - main
 
jobs:
  test:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
 
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
 
      - name: Run tests
        run: |
          pytest day8/test_app.py
 
      - name: Create artifact
        run: |
          mkdir -p artifact
          cp day8/test_app.py artifact/
 
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: day8-test-artifact
          path: artifact/
