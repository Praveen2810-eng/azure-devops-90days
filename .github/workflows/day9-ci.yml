name: Day9 Build and Artifact
 
on:
  push:
    branches:
      - main
      - feature/day9-devops
  pull_request:
    branches:
      - main
 
jobs:
  build:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
 
      - name: Run application
        run: |
          python day9/missing.py
 
      - name: Create build artifact
        run: |
          mkdir -p artifact
          zip -j artifact/day9-app.zip day9/app.py
 
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: day9-app-artifact
          path: artifact/day9-app.zip
